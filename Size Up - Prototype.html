  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rder-box;margin:0;padding:0}html{scroll-behavior:smooth}\nbody{background:var(--bg);color:var(--ink);font-family:var(--fc);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}\n/* Body copy uses Cormorant for warmth */\np,li,label,.sub{font-family:var(--fs);font-size:15.5px;line-height:1.65}\nh1,h2,h3,h4{font-family:var(--fc);font-weight:700;letter-spacing:-.035em;line-height:1.02}\na{color:inherit;text-decoration:none}img{max-width:100%;display:block}\n.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;position:relative;z-index:2}\nsection{position:relative}\n.accent{color:var(--violet)}.dim{opacity:.55}.blue{color:var(--blue)}\n.cg{font-family:var(--fm);font-style:normal;font-weight:600}\n.mono{font-family:var(--fm)}\n\n/* Glass */\n.gc{\n  background:var(--glass-2);border:1px solid var(--gb);\n  border-radius:var(--r);backdrop-filter:blur(24px) saturate(160%);\n  box-shadow:var(--gsh);transition:transform .35s var(--ease),box-shadow .35s\n}\n.gc:hover{transform:translateY(-6px);box-shadow:var(--gsh-lg)}\n.gc-hi{\n  background:var(--glass-3);border:1px solid var(--gb2);\n  border-radius:var(--r);backdrop-filter:blur(28px) saturate(180%);\n  box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3)\n}\n\n/* Pill */\n.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);background:rgba(212,113,255,.14);border:1px solid rgba(212,113,255,.35);padding:7px 14px;border-radius:999px;backdrop-filter:blur(8px)}\n.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:beat 1.8s infinite}\n@keyframes beat{0%,100%{opacity:1}50%{opacity:.3}}\n\n/* Buttons */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fc);font-weight:700;font-size:16px;letter-spacing:.01em;padding:14px 28px;border-radius:12px;border:none;cursor:pointer;min-height:50px;white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s}\n.btn-primary{background:linear-gradient(135deg,var(--violet),#A855F7 50%,var(--blue));color:#fff;box-shadow:0 12px 28px -8px rgba(168,85,247,.6),inset 0 1px 0 rgba(255,255,255,.3)}\n.btn-primary:hover{transform:translateY(-3px);box-shadow:0 20px 40px -8px rgba(168,85,247,.75),inset 0 1px 0 rgba(255,255,255,.4)}\n.btn-glass{background:var(--glass-2);color:var(--ink);border:1px solid var(--gb);backdrop-filter:blur(12px)}\n.btn-glass:hover{transform:translateY(-3px);background:var(--glass-3)}\n.btn-lg{padding:16px 34px;font-size:17px;min-height:56px}\n\n/* Nav */\nheader.nav{position:sticky;top:0;z-index:50;background:rgba(3,2,14,.72);backdrop-filter:blur(20px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}\nheader.nav.scrolled{border-bottom:1px solid var(--gb);box-shadow:0 4px 24px rgba(0,0,0,.4)}\n.nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px}\n.logo{display:flex;align-items:center;gap:10px;font-family:var(--fc);font-weight:700;font-size:20px;letter-spacing:-.03em}\n.logo-mark{width:34px;height:44px;display:grid;place-items:center;flex:none;transition:transform .4s var(--ease);filter:drop-shadow(0 4px 10px rgba(168,85,247,.45))}\n.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.08)}\n.nav-links{display:flex;align-items:center;gap:30px}\n.nav-links a{font-family:var(--fc);font-size:14px;letter-spacing:-.01em;color:var(--ink-s);font-weight:600;transition:color .2s}\n.nav-links a:hover{color:var(--ink)}\n.hamburger{display:none;background:var(--glass-2);border:1px solid var(--gb);border-radius:10px;width:44px;height:44px;cursor:pointer;flex-direction:column;gap:5px;align-items:center;justify-content:center;backdrop-filter:blur(8px)}\n.hamburger span{width:18px;height:1.5px;background:var(--ink);border-radius:2px;transition:.3s}\n.hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}.hamburger.open span:nth-child(2){opacity:0}.hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}\n.mobile-menu{position:fixed;inset:72px 0 auto 0;z-index:49;background:rgba(3,2,14,.97);backdrop-filter:blur(22px);border-bottom:1px solid var(--gb);padding:16px 24px 24px;display:none;flex-direction:column;gap:4px}\n.mobile-menu.open{display:flex}\n.mobile-menu a{padding:14px 8px;font-family:var(--fc);font-size:17px;color:var(--ink-s);border-bottom:1px solid var(--glass-1);font-weight:600}\n.mobile-menu .btn{margin-top:14px}\n\n/* HERO */\n.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;padding:100px 0 70px}\n.hero-bg{position:absolute;inset:0;z-index:0}\n.hero-bg-img{width:100%;height:100%;object-fit:cover;object-position:center bottom;opacity:.9}\n.hero-bg-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,2,14,.25) 0%,rgba(3,2,14,.18) 35%,rgba(3,2,14,.55) 75%,var(--bg) 100%)}\n.hero-inner{display:grid;grid-template-columns:260px 1fr 260px;gap:32px;align-items:center;position:relative;z-index:2}\n.hero-phone-wrap{display:flex;justify-content:center;align-items:flex-end}\n.hero-phone{border-radius:28px;overflow:hidden;animation:bobH 7s ease-in-out infinite;max-width:240px;width:100%}\n.hero-phone.r{animation-delay:.9s}\n@keyframes bobH{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}\n.hero-center{text-align:center;position:relative}\n.hero h1{font-size:clamp(38px,5.5vw,76px);font-weight:800;color:#fff;margin:22px auto 0;letter-spacing:-.04em;max-width:16ch}\n.hero-sub{font-family:var(--fm);font-weight:600;font-size:clamp(15px,1.8vw,20px);color:rgba(255,255,255,.78);margin:14px auto 0;letter-spacing:-.01em}\n.hero-lead{font-family:var(--fs);font-size:clamp(14px,1.7vw,17px);color:rgba(255,255,255,.62);max-width:520px;margin:18px auto 0;line-height:1.7}\n.hero-cta{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap}\n/* Urgency micro-badge (scarcity) */\n.urgency{display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-size:11px;color:rgba(255,255,255,.5);margin-top:16px}\n.urgency .dot{width:6px;height:6px;border-radius:50%;background:var(--violet);animation:beat 2s infinite}\n.proof{display:inline-flex;align-items:center;gap:9px;margin-top:12px;font-family:var(--fm);font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.03em}\n.proof .pp{width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 7px var(--pink)}\n\n/* Social proof strip (authority) */\n.proof-strip{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:28px;flex-wrap:wrap}\n.proof-item{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.04em}\n.proof-item .n{font-family:var(--fc);font-size:20px;font-weight:700;color:#fff}\n.proof-sep{width:1px;height:28px;background:rgba(255,255,255,.15)}\n\n/* Marquee */\n.marquee-sec{padding:26px 0;border-top:1px solid var(--glass-1);border-bottom:1px solid var(--glass-1);background:rgba(0,0,0,.2);backdrop-filter:blur(10px)}\n.mqcap{font-family:var(--fm);font-size:11px;color:var(--ink-dim);letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-bottom:14px}\n.marquee{overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}\n.track{display:flex;gap:12px;width:max-content;animation:mq 22s linear infinite}\n.marquee:hover .track{animation-play-state:paused}\n@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n.tchip{font-family:var(--fm);font-size:13px;font-weight:700;color:var(--blue);background:rgba(123,139,255,.1);border:1px solid rgba(123,139,255,.2);padding:9px 18px;border-radius:999px;white-space:nowrap}\n\n/* Sections */\n.sec{padding:96px 0}\n.sec-head{max-width:720px;margin:0 auto 52px;text-align:center}\n.sec-head h2{font-size:clamp(30px,5vw,58px);font-weight:800;margin:16px 0 14px;letter-spacing:-.04em}\n.sec-head .subhead{font-family:var(--fm);font-weight:600;font-size:clamp(14px,1.8vw,18px);color:var(--ink-s)}\n.sec-cta{display:flex;justify-content:center;margin-top:48px}\n\n/* FIT */\n.fit-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}\n.fit-card{padding:36px;position:relative}\n.fit-card.yes{border-top:3px solid var(--green)}\n.fit-card.no{border-top:3px solid var(--amber)}\n.fit-card h3{font-size:22px;margin-bottom:22px;display:flex;align-items:center;gap:11px;color:#fff}\n.fit-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}\n.fit-card.yes .fit-ic{background:rgba(16,185,129,.2);color:var(--green)}\n.fit-card.no .fit-ic{background:rgba(245,158,11,.2);color:var(--amber)}\n.fit-list{list-style:none;display:flex;flex-direction:column;gap:14px}\n.fit-list li{display:flex;gap:12px;font-family:var(--fs);font-size:15.5px;color:var(--ink-s);line-height:1.5}\n.fit-list li .b{flex:none;margin-top:2px;font-family:var(--fm);font-weight:700;font-size:13px}\n.fit-card.yes .b{color:var(--green)}.fit-card.no .b{color:var(--amber)}\n\n/* STATS */\n.stats-sec{padding:72px 0;background:linear-gradient(135deg,rgba(109,40,217,.22),rgba(123,139,255,.1))}\n.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}\n.stat{padding:32px 20px;text-align:center;position:relative}\n.stat .num{font-family:var(--fc);font-size:clamp(38px,5vw,60px);font-weight:800;color:#fff;line-height:1;letter-spacing:-.04em}\n.stat .lbl{font-family:var(--fm);color:var(--ink-s);font-size:11.5px;margin-top:10px;letter-spacing:.02em;line-height:1.4}\n\n/* MÉTHODE */\n.method-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}\n.m-card{padding:28px 22px}\n.m-card .step{font-family:var(--fm);font-size:12px;font-weight:700;color:rgba(212,113,255,.7);letter-spacing:.14em}\n.m-ic{width:50px;height:50px;border-radius:14px;background:rgba(212,113,255,.14);display:grid;place-items:center;margin:16px 0;color:var(--violet)}\n.m-card h3{font-size:22px;color:#fff;margin-bottom:8px}\n.m-card p{font-family:var(--fs);font-size:14.5px;color:var(--ink-s);line-height:1.55;margin-bottom:12px}\n.srv-chips{display:flex;flex-wrap:wrap;gap:6px}\n.srv-chips span{font-family:var(--fm);font-size:10px;color:var(--violet);background:rgba(212,113,255,.1);border:1px solid rgba(212,113,255,.22);padding:4px 9px;border-radius:999px}\n\n/* TÉMOIGNAGES */\n.tg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}\n.tg-card{padding:30px 26px 24px;display:flex;flex-direction:column}\n/* Decorative serif quote */\n.tg-q{font-family:var(--fm);font-size:80px;line-height:.6;color:rgba(212,113,255,.28);height:38px}\n.tg-result{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-family:var(--fm);font-size:11px;font-weight:700;color:var(--green);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);padding:5px 10px;border-radius:8px;margin-bottom:14px}\n/* Testimonial quote in serif italic — editorial register */\n.tg-card blockquote{font-family:var(--fs);font-style:italic;font-size:18.5px;line-height:1.5;color:rgba(255,255,255,.9);margin-bottom:22px;flex:1;letter-spacing:.005em}\n.tg-meta{border-top:1px solid var(--glass-1);padding-top:14px;display:flex;align-items:center;gap:11px}\n.tg-av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--fc);font-weight:700;font-size:15px;color:#fff;flex:none}\n.tg-nm{font-family:var(--fc);font-weight:700;font-size:14px;color:#fff}\n.tg-rl{font-family:var(--fs);font-size:14px;color:var(--ink-s)}\n.tg-cx{font-family:var(--fm);font-size:10px;color:var(--ink-dim);margin-top:3px}\n\n/* EXPERTISES */\n.exp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}\n.exp-card{padding:0;display:flex;flex-direction:column;position:relative}\n.exp-img{height:200px;overflow:hidden;border-radius:var(--r) var(--r) 0 0}\n.exp-img img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .6s var(--ease)}\n.exp-card:hover .exp-img img{transform:scale(1.04)}\n.exp-body{padding:24px 26px 28px;display:flex;flex-direction:column;gap:12px;flex:1}\n.exp-head{display:flex;align-items:center;gap:14px}\n.exp-ic{width:48px;height:48px;border-radius:13px;background:rgba(212,113,255,.14);display:grid;place-items:center;flex:none;color:var(--violet)}\n.exp-card h3{font-size:22px;color:#fff;margin:0}\n.exp-card p{font-family:var(--fs);font-size:14.5px;color:var(--ink-s);line-height:1.55;margin:0}\n.exp-tags{display:flex;flex-wrap:wrap;gap:7px}\n.exp-tags span{font-family:var(--fm);font-size:10px;color:var(--blue);background:rgba(123,139,255,.1);border:1px solid rgba(123,139,255,.22);padding:4px 10px;border-radius:999px}\n\n/* CTA mid */\n.cta-sec{padding:30px 0 96px}\n.cta-box{border-radius:28px;padding:72px 52px;display:flex;align-items:center;gap:52px;flex-wrap:wrap;position:relative;overflow:hidden}\n.cta-box::before{content:\"\";position:absolute;width:700px;height:700px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(168,85,247,.35),transparent 60%);animation:halo 8s ease-in-out infinite;pointer-events:none;will-change:transform,opacity}\n@keyframes halo{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.3);opacity:1}}\n.cta-text{flex:1;min-width:300px;position:relative;z-index:1}\n.cta-text h2{font-size:clamp(28px,4.5vw,52px);font-weight:800;color:#fff;letter-spacing:-.04em;margin-bottom:12px}\n.cta-text h2 em{font-family:var(--fm);font-style:normal;color:var(--violet);font-weight:700;letter-spacing:0}\n.cta-text p{font-family:var(--fs);font-size:15.5px;color:var(--ink-s);margin-bottom:26px;max-width:460px}\n.cta-text .micro{font-family:var(--fm);font-size:11px;color:var(--ink-dim);margin-top:12px}\n/* Urgency trigger */\n.cta-urgency{display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-size:11px;color:rgba(212,113,255,.8);background:rgba(212,113,255,.1);border:1px solid rgba(212,113,255,.2);padding:6px 12px;border-radius:8px;margin-bottom:16px}\n/* ---- La Flèche : placements (toujours HORS du contenu, en interaction) ---- */\n.fleche{position:absolute;z-index:6;pointer-events:none}\n.fleche .fl-inner{display:block}\n.fl-hero-l{left:-118px;top:128px;width:96px}\n.fl-hero-r{right:-112px;top:48px;width:86px}\n.fl-sit{top:-86px;right:30px;width:84px}\n.fl-hang{top:-56px;right:-12px;width:74px}\n.fl-peek{top:-48px;left:34px;width:88px}\n.fl-sitpoint{top:-80px;right:26px;width:84px}\n.fl-wm{position:absolute;z-index:2;pointer-events:none}\n.btn-anchor{position:relative;display:inline-block}\n.fl-cta{left:50%;top:-104px;margin-left:-46px;width:92px;opacity:0}\n.reveal.in .fl-cta{animation:flecheArrive .45s ease-out .3s both}\n.reveal.in .fl-cta .fl-inner{animation:flechePoint 3s ease-in-out 1s infinite;transform-origin:50% 80%}\n@keyframes flecheArrive{0%{opacity:0;transform:translateY(-150px)}70%{opacity:1;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}\n@keyframes flechePoint{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(4deg) translateY(7px)}}\n#fit::before,#expertises::before,#formations::before{content:\"\";position:absolute;inset:0;background:radial-gradient(ellipse 55% 45% at 15% 0%,rgba(123,139,255,.08),transparent 60%),radial-gradient(ellipse 50% 45% at 88% 100%,rgba(212,113,255,.07),transparent 60%);pointer-events:none}\n@media(max-width:1200px){.fl-hero-l,.fl-hero-r{display:none}}\n\n/* FORMATIONS */\n.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}\n.form-card{padding:28px}\n.form-card .tag{font-family:var(--fm);font-size:11px;color:var(--blue);font-weight:700;letter-spacing:.1em;text-transform:uppercase}\n.form-card h3{font-size:19px;color:#fff;margin:12px 0 8px}\n.form-card p{font-family:var(--fs);font-size:14px;color:var(--ink-s);line-height:1.55}\n\n/* FOOTER */\nfooter{background:#000;padding-top:64px}\n.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;gap:28px;margin-bottom:52px}\n.foot-brand .logo{margin-bottom:14px}\n.foot-brand p{font-family:var(--fs);color:var(--ink-s);font-size:14.5px;max-width:280px}\n.foot-col h4{font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:16px;font-weight:700}\n.foot-col ul{list-style:none;display:flex;flex-direction:column;gap:10px}\n.foot-col a{font-family:var(--fs);color:var(--ink-s);font-size:14.5px;transition:color .2s}.foot-col a:hover{color:#fff}\n.wordmark-area{background:#000;border-top:1px solid var(--glass-0);overflow:hidden;position:relative;height:220px}\n.wordmark{font-family:var(--fc);font-weight:800;font-size:clamp(80px,19vw,280px);line-height:.76;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.1);user-select:none;white-space:nowrap;text-align:center;padding-top:28px;position:relative;z-index:1}\n.foot-mascots{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:flex-end;padding:0 8%;z-index:2;pointer-events:none}\n.foot-bottom{background:#000;padding:20px 24px;font-family:var(--fm);font-size:11px;color:var(--ink-dim);border-top:1px solid var(--glass-0)}\n.foot-bottom-inner{max-width:var(--maxw);margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}\n\n/* MODAL */\n.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,20,.6);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:24px;overflow-y:auto}\n.modal-backdrop.open{display:flex}\n.modal{background:rgba(12,10,30,.92);border:1px solid var(--gb);border-radius:24px;padding:40px 36px;max-width:470px;width:100%;position:relative;box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(28px);animation:pop .35s var(--ease);margin:auto}\n@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}}\n.modal .close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:9px;background:var(--glass-1);border:1px solid var(--gb);color:var(--ink-s);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:.2s}\n.modal .close:hover{background:var(--glass-2)}\n.modal h3{font-size:26px;font-weight:800;margin-bottom:8px;padding-right:30px;letter-spacing:-.03em;color:#fff}\n.modal .sub{font-family:var(--fs);font-size:14.5px;color:var(--ink-s);margin-bottom:24px}\n.field{margin-bottom:14px}\n.field label{display:block;font-family:var(--fm);font-size:10px;font-weight:700;color:var(--ink-s);margin-bottom:7px;letter-spacing:.06em;text-transform:uppercase}\n.field input{width:100%;padding:13px 14px;border-radius:12px;background:var(--glass-1);border:1.5px solid var(--gb);color:#fff;font-family:var(--fc);font-size:15px;transition:border-color .2s,box-shadow .2s;min-height:48px}\n.field input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(212,113,255,.15)}\n.field input::placeholder{color:var(--ink-dim);font-family:var(--fs);font-style:italic}\n.modal .btn{width:100%;margin-top:6px}\n.rgpd{font-family:var(--fs);font-size:13px;color:var(--ink-dim);margin-top:12px;line-height:1.5;display:flex;gap:8px;font-style:italic}\n.rgpd svg{flex:none;margin-top:3px;flex-shrink:0}\n.modal-success{text-align:center;padding:16px 0}\n.modal-success .ok{width:62px;height:62px;border-radius:50%;background:rgba(16,185,129,.12);display:grid;place-items:center;margin:0 auto 18px;color:var(--green)}\n.modal-success h3{padding:0;margin-bottom:8px}\n.modal-success p{font-family:var(--fs);font-size:16px;color:var(--ink-s)}\n.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(3,2,14,0),rgba(3,2,14,.97) 35%);display:none}\n.sticky-cta .btn{width:100%}\n\n/* Reveal */\n.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s var(--ease),transform .7s var(--ease)}\n.reveal.in{opacity:1;transform:none}\n.stagger>*{opacity:0;transform:translateY(24px);transition:opacity .65s var(--ease),transform .65s var(--ease)}\n.stagger.in>*{opacity:1;transform:none}\n.reveal.shown,.stagger.shown>*{opacity:1!important;transform:none!important;transition:none!important}\n\n/* Mascot animations */\n@keyframes mGlitch{\n  0%{opacity:0;transform:scale(.25) translate(0,0)}\n  15%{opacity:1;transform:scale(.82) translate(9px,-6px)}\n  28%{transform:scale(.82) translate(-7px,5px)}\n  44%{transform:scale(1.1) translate(4px,-3px)}\n  58%{transform:scale(.96) translate(-2px,1px)}\n  72%{transform:scale(1.03)}\n  100%{opacity:1;transform:scale(1)}\n}\n@keyframes mFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}\n@keyframes mFloatSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}\n.m-glitch{animation:mGlitch .7s var(--ease) both,mFloat 3.5s ease-in-out .8s infinite;will-change:transform}\n.m-glitch-d{animation:mGlitch .7s var(--ease) .3s both,mFloatSlow 4s ease-in-out 1.1s infinite;will-change:transform}\n.m-float{animation:mFloatSlow 4s ease-in-out infinite}\n\n@media(max-width:980px){\n  .nav-links,header.nav .btn{display:none}\n  .hamburger{display:flex}\n  .hero{min-height:auto;padding:80px 0 50px}\n  .hero-inner{grid-template-columns:1fr;gap:24px;text-align:center;justify-items:center}\n  .hero-phone-wrap{display:none}\n  .method-grid,.tg-grid{grid-template-columns:1fr 1fr}\n  .stats-grid{grid-template-columns:repeat(2,1fr)}\n  .foot-grid{grid-template-columns:1fr 1fr}\n  .form-grid{grid-template-columns:repeat(2,1fr)}\n  .cta-box{padding:48px 24px;gap:28px}\n  .fl-hang,.fl-sitpoint,.fl-peek{display:none}\n  .sticky-cta{display:block}\n  body{padding-bottom:80px}\n  .exp-grid{grid-template-columns:1fr}\n}\n@media(max-width:600px){\n  .fit-grid,.method-grid,.tg-grid,.form-grid{grid-template-columns:1fr}\n  .stats-grid{grid-template-columns:1fr 1fr}\n  .sec,.stats-sec,.cta-sec{padding:64px 0}\n  .hero h1{font-size:36px}\n  .hero-cta{flex-direction:column}.hero-cta .btn{width:100%}\n  .foot-grid{grid-template-columns:1fr}\n  .proof-strip{gap:14px}\n}\n@media(prefers-reduced-motion:reduce){\n  *{animation:none!important;transition-duration:.001ms!important}\n  .reveal,.stagger>*{opacity:1!important;transform:none!important}\n  .fl-cta{opacity:1!important}\n  html{scroll-behavior:auto}\n}\n\n/* =========================================================\n   LA FLÈCHE — animations & placements (v2)\n   ========================================================= */\n:root{--line:#7c3aed;--line2:#D471FF}\n/* progressive depth gradient (critique #6) */\nbody::before{content:\"\";position:fixed;inset:0;z-index:0;pointer-events:none;\n  background:linear-gradient(180deg,#020109 0%,#05030f 42%,#0a0618 72%,#0f0a22 100%)}\n\n/* ---- LOADER ---- */\n#loader{position:fixed;inset:0;z-index:300;background:#020109;display:grid;place-items:center;transition:opacity .55s ease}\n#loader.done{opacity:0;pointer-events:none}\n.loader-stage{position:relative;width:min(540px,78vw);height:150px}\n.loader-word{position:absolute;left:0;right:0;top:6px;text-align:center;font-family:var(--fc);font-weight:800;font-size:clamp(28px,6vw,56px);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.4px rgba(168,85,247,.28);opacity:0;animation:lWord .8s ease .15s forwards}\n@keyframes lWord{to{opacity:1}}\n.loader-line{position:absolute;left:0;right:0;bottom:34px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--line),var(--line2),var(--line),transparent);transform:scaleX(0);transform-origin:left;animation:lLine 1.25s cubic-bezier(.4,0,.2,1) forwards}\n@keyframes lLine{to{transform:scaleX(1)}}\n.loader-runner{position:absolute;bottom:28px;width:58px;transform:translateX(-50%);animation:lRun 1.35s cubic-bezier(.42,0,.6,1) forwards}\n@keyframes lRun{from{left:-4%}to{left:104%}}\n\n/* ---- COURSE : membres groupés (uniquement pose run) ---- */\n[data-fleche=\"run\"] svg [class^=\"fl-\"]{transform-box:view-box}\n[data-fleche=\"run\"] .fl-inner{animation:rBob .42s linear infinite}\n[data-fleche=\"run\"] .fl-lega{transform-origin:52px 112px;animation:rLegA .42s linear infinite}\n[data-fleche=\"run\"] .fl-legb{transform-origin:68px 112px;animation:rLegB .42s linear infinite}\n[data-fleche=\"run\"] .fl-arma{transform-origin:42px 80px;animation:rArmA .42s linear infinite}\n[data-fleche=\"run\"] .fl-armb{transform-origin:78px 80px;animation:rArmB .42s linear infinite}\n@keyframes rBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}\n@keyframes rLegA{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-28deg)}}\n@keyframes rLegB{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(28deg)}}\n@keyframes rArmA{0%,100%{transform:rotate(-32deg)}50%{transform:rotate(32deg)}}\n@keyframes rArmB{0%,100%{transform:rotate(32deg)}50%{transform:rotate(-32deg)}}\n\n/* ---- TRANSITIONS ENTRE SECTIONS ---- */\n.sxn-trans{position:relative;height:60px;overflow:visible;pointer-events:none;z-index:3}\n.sxn-trans .sxn-line{position:absolute;left:0;right:0;top:50%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--line) 14%,var(--line2) 50%,var(--line) 86%,transparent);transform:scaleX(0);transform-origin:left;transition:transform .65s cubic-bezier(.4,0,.2,1)}\n.sxn-trans.in .sxn-line{transform:scaleX(1)}\n.sxn-trans .sxn-runner{position:absolute;top:calc(50% - 42px);width:44px;left:-6%;opacity:0;filter:drop-shadow(0 6px 10px rgba(124,58,237,.4))}\n.sxn-trans.in .sxn-runner{animation:sxnRun .95s cubic-bezier(.42,0,.6,1) .04s forwards}\n@keyframes sxnRun{0%{left:-6%;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:104%;opacity:0}}\n\n/* ---- HERO : phones au premier plan + mascotte qui interagit ---- */\n.hero-inner3{display:grid;grid-template-columns:280px 1fr 280px;gap:24px;align-items:center;position:relative;z-index:2}\n.hero-col{position:relative;display:flex;justify-content:center}\n.phone{width:228px;border-radius:30px;background:#0b0a16;border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);padding:9px;animation:bobH 7s ease-in-out infinite;will-change:transform}\n.hero-col.right .phone{animation-delay:.9s}\n.phone-scr{background:#fdfdff;border-radius:23px;padding:15px 14px;color:#15131f;min-height:344px;display:flex;flex-direction:column;gap:11px;overflow:hidden}\n.ph-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--fm);font-size:11px;color:#6b6779;font-weight:600}\n.ph-sig{width:34px;height:11px;border-radius:3px;background:repeating-linear-gradient(90deg,#15131f 0 3px,transparent 3px 5px);opacity:.6}\n.ph-title{font-family:var(--fc);font-weight:800;font-size:16px;letter-spacing:-.02em}\n.ph-leads{list-style:none;display:flex;flex-direction:column;gap:8px}\n.ph-leads li{display:flex;align-items:center;gap:9px;font-family:var(--fs);font-size:12.5px;color:#33303d;border-bottom:1px solid #f0eef4;padding-bottom:7px}\n.ph-leads b{margin-left:auto;font-family:var(--fm);font-weight:700;color:#15131f}\n.pd{width:9px;height:9px;border-radius:50%;background:#cdc9d7;flex:none}\n.pd.won{background:#10B981}.pd.book{background:#7B8BFF}.pd.unq{background:#ef4444}.pd.q{background:#A855F7}.pd.nl{background:#F472B6}\n.ph-dash-h{font-family:var(--fc);font-weight:800;font-size:15px;display:flex;flex-direction:column;letter-spacing:-.02em}\n.ph-dash-h small{font-family:var(--fs);font-weight:500;font-size:11px;color:#8a8694;letter-spacing:0}\n.ph-tabs{display:flex;gap:6px}\n.ph-tabs span{font-family:var(--fm);font-size:11px;padding:5px 10px;border-radius:8px;background:#f1eff5;color:#6b6779}\n.ph-tabs .on{background:#ece7fb;color:#7C3AED;font-weight:700}\n.ph-kpi{background:#f7f6fb;border-radius:14px;padding:12px 13px}\n.ph-lbl{font-family:var(--fm);font-size:11px;color a').forEach(function(a){\n  a.addEventListener('click',function(){\n    menu.classList.remove('open');burger.classList.remove('open');\n    burger.setAttribute('aria-expanded','false');\n  });\n});\n\n/* ---- Modal ---- */\nvar modal=document.getElementById('modal'),lastF=null;\nfunction openM(){\n  lastF=document.activeElement;modal.classList.add('open');\n  document.body.style.overflow='hidden';\n  menu.classList.remove('open');burger.classList.remove('open');\n  var i=document.getElementById('f-name');\n  if(i)setTimeout(function(){i.focus();},60);\n}\nfunction closeM(){\n  modal.classList.remove('open');document.body.style.overflow='';\n  if(lastF)lastF.focus();\n}\ndocument.querySelectorAll('[data-modal]').forEach(function(b){b.addEventListener('click',openM);});\ndocument.getElementById('modalClose').addEventListener('click',closeM);\nmodal.addEventListener('click',function(e){if(e.target===modal)closeM();});\naddEventListener('keydown',function(e){if(e.key==='Escape'&&modal.classList.contains('open'))closeM();});\ndocument.getElementById('contactForm').addEventListener('submit',function(e){\n  e.preventDefault();if(!this.checkValidity()){this.reportValidity();return;}\n  document.getElementById('modalForm').style.display='none';\n  document.getElementById('modalSuccess').style.display='block';\n});\n\n/* ---- Count-up ---- */\nfunction countUp(el){\n  var target=parseFloat(el.getAttribute('data-count'));\n  var pre=el.getAttribute('data-prefix')||'';\n  var suf=el.getAttribute('data-suffix')||'';\n  var dec=(target%1!==0)?1:0;\n  var dur=1200,t0=null;\n  function f(ts){\n    if(!t0)t0=ts;\n    var p=Math.min((ts-t0)/dur,1);\n    var e=1-Math.pow(1-p,3);\n    el.textContent=pre+(target*e).toFixed(dec)+suf;\n    if(p<1)requestAnimationFrame(f);\n    else el.textContent=pre+target.toFixed(dec)+suf;\n  }\n  requestAnimationFrame(f);\n}\nvar setCount=function(el){\n  var t=parseFloat(el.getAttribute('data-count'));\n  el.textContent=(el.getAttribute('data-prefix')||'')+(t%1?t.toFixed(1):t)+(el.getAttribute('data-suffix')||'');\n};\n\n/* ---- Reveal (scroll-based, robust) ---- */\nvar allR=[].slice.call(document.querySelectorAll('.reveal,.stagger'));\nvar revR=allR.slice();\nif(reduce){\n  allR.forEach(function(el){el.classList.add('in');});\n  document.querySelectorAll('[data-count]').forEach(setCount);\n} else {\n  revR.forEach(function(el){\n    if(el.classList.contains('stagger')){\n      [].forEach.call(el.children,function(c,i){c.style.transitionDelay=(i*85)+'ms';});\n    }\n  });\n  var check=function(){\n    var vh=innerHeight,tr=vh*.92;\n    for(var i=revR.length-1;i>=0;i--){\n      var el=revR[i];\n      if(el.getBoundingClientRect().top<tr){\n        el.classList.add('in');\n        el.querySelectorAll('[data-count]').forEach(function(c){\n          if(!c.dataset.done&&!c.dataset.manual){c.dataset.done=1;countUp(c);}\n        });\n        revR.splice(i,1);\n      }\n    }\n  };\n  var tick=false;\n  var onSR=function(){if(tick)return;tick=true;requestAnimationFrame(function(){check();tick=false;});};\n  addEventListener('scroll',onSR,{passive:true});\n  addEventListener('resize',onSR,{passive:true});\n  requestAnimationFrame(function(){requestAnimationFrame(check);});\n  setTimeout(function(){\n    allR.forEach(function(el){\n      el.classList.add('in','shown');\n      el.querySelectorAll('[data-count]').forEach(function(c){\n        if(!c.dataset.done&&!c.dataset.manual){c.dataset.done=1;setCount(c);}\n      });\n    });\n  },2800);\n}\n\n/* ============================================================\n   LA FLÈCHE — mascotte officielle (triangle violet, pointe en haut)\n   Builder SVG paramétrique : pose + couleur. Membres groupés\n   pour animation CSS (course, etc.). Toujours HORS du contenu.\n   ============================================================ */\nvar flN=0;\nvar PALETTE={\n  violet:{b:'#A855F7',s:'#2D1657'},\n  pink:  {b:'#F472B6',s:'#5B1239'},\n  green: {b:'#34D399',s:'#0B3B2C'},\n  orange:{b:'#FB923C',s:'#5A2706'},\n  blue:  {b:'#818CF8',s:'#1E1B57'},\n  yellow:{b:'#FACC15',s:'#5A4406'}\n};\nfunction fleche(pose,colorKey){\n  flN++;\n  var c=PALETTE[colorKey]||PALETTE.violet;\n  var B=c.b,S=c.s,D='#14061f',P='#fff';\n  var px=(pose==='look'||pose==='mischief')?3:0, py=(pose==='pointboth'||pose==='sitpoint'||pose==='lie')?2:0;\n  var body='<path d=\"M60,8 L106,64 L78,64 L78,112 L42,112 L42,64 L14,64 Z\" fill=\"'+B+'\" stroke=\"'+S+'\" stroke-width=\"6\" stroke-linejoin=\"round\"/>'\n    +'<path d=\"M60,18 L90,55 L66,55 Z\" fill=\"#fff\" opacity=\".14\"/>';\n  function eyes(open){\n    if(open===false){ // wink-ish closed-ish handled separately\n      return '';\n    }\n    return '<circle cx=\"47\" cy=\"46\" r=\"7.5\" fill=\"#fff\"/><circle cx=\"73\" cy=\"46\" r=\"7.5\" fill=\"#fff\"/>'\n      +'<circle cx=\"'+(48.5+px)+'\" cy=\"'+(47.5+py)+'\" r=\"3.6\" fill=\"'+D+'\"/><circle cx=\"'+(74.5+px)+'\" cy=\"'+(47.5+py)+'\" r=\"3.6\" fill=\"'+D+'\"/>'\n      +'<circle cx=\"'+(46+px)+'\" cy=\"44\" r=\"1.6\" fill=\"#fff\"/><circle cx=\"'+(72+px)+'\" cy=\"44\" r=\"1.6\" fill=\"#fff\"/>';\n  }\n  var mouthHappy='<path d=\"M50,57 Q60,65 70,57\" stroke=\"'+D+'\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/>';\n  var mouthBig='<path d=\"M48,56 Q60,69 72,56\" stroke=\"'+D+'\" stroke-width=\"3.4\" fill=\"none\" stroke-linecap=\"round\"/>';\n  var mouthFlat='<path d=\"M51,58 L69,58\" stroke=\"'+D+'\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/>';\n  var mouthSmirk='<path d=\"M50,57 Q62,64 70,55\" stroke=\"'+D+'\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/>';\n  var cheeks='<circle cx=\"35\" cy=\"55\" r=\"5\" fill=\"#F472B6\" opacity=\".45\"/><circle cx=\"85\" cy=\"55\" r=\"5\" fill=\"#F472B6\" opacity=\".45\"/>';\n  var face=eyes()+mouthHappy+cheeks;\n  function arm(d){return '<path d=\"'+d+'\" stroke=\"'+B+'\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\"/>';}\n  function armS(d,st){return '<path d=\"'+d+'\" stroke=\"'+st+'\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\"/>';}\n  function hand(x,y){return '<circle cx=\"'+x+'\" cy=\"'+y+'\" r=\"6.5\" fill=\"'+B+'\"/>';}\n  function finger(x,y,dx,dy){return '<path d=\"M'+x+','+y+' l'+dx+','+dy+'\" stroke=\"'+B+'\" stroke-width=\"5\" stroke-linecap=\"round\"/>';}\n  function shoe(x,y){return '<ellipse cx=\"'+x+'\" cy=\"'+y+'\" rx=\"9\" ry=\"5\" fill=\"'+S+'\"/>';}\n  var legsStand=arm('M52,112 L52,135')+arm('M68,112 L68,135')+shoe(49,140)+shoe(71,140);\n  var legsDangle=arm('M52,112 Q55,128 49,140')+arm('M68,112 Q71,128 65,140')+shoe(46,144)+shoe(62,144);\n  var legsCross=arm('M52,112 Q70,124 76,134')+arm('M68,112 Q50,124 44,134')+shoe(78,137)+shoe(42,137);\n  var vb='0 0 124 156', g='';\n\n  if(pose==='stand'){\n    g=arm('M42,80 Q26,90 20,102')+hand(19,104)+arm('M78,80 Q94,90 100,102')+hand(101,104)+body+legsStand+face;\n  } else if(pose==='point'){\n    g=arm('M42,82 Q32,94 42,100')+hand(44,100)+body+legsDangle+face\n     +arm('M78,76 Q98,70 112,68')+hand(114,68)+finger(118,68,8,-1);\n    vb='0 0 134 156';\n  } else if(pose==='look'){\n    g=arm('M42,82 Q34,96 40,106')+hand(41,108)+arm('M78,82 Q86,96 80,106')+hand(79,108)+body+legsDangle+face;\n  } else if(pose==='sit'){\n    g=body+arm('M42,84 Q38,98 46,104')+hand(47,105)+arm('M78,84 Q82,98 74,104')+hand(73,105)+legsDangle+face;\n  } else if(pose==='sitpoint'){\n    g=body+arm('M42,84 Q38,98 46,104')+hand(47,105)+arm('M78,82 Q92,98 88,114')+hand(88,118)+finger(88,123,1,8)+legsDangle+face;\n  } else if(pose==='hang'){\n    g=arm('M46,72 Q40,54 44,40')+hand(44,38)+arm('M78,82 Q86,96 80,106')+hand(79,108)+body+legsDangle+face;\n  } else if(pose==='peek'){\n    var cid='flcp'+flN;\n    g='<g clip-path=\"url(#'+cid+')\">'+body+face+'<\u002Fg>'\n     +hand(36,66)+finger(36,60,0,-7)+hand(84,66)+finger(84,60,0,-7);\n    return '<svg viewBox=\"0 0 124 76\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;width:100%\"><defs><clipPath id=\"'+cid+'\"><rect x=\"0\" y=\"0\" width=\"124\" height=\"70\"/><\u002FclipPath><\u002Fdefs>'+g+'<\u002Fsvg>';\n  } else if(pose==='pointboth'){\n    g=body\n     +arm('M42,80 Q34,98 38,114')+hand(38,118)+finger(38,123,-1,8)\n     +arm('M78,80 Q86,98 82,114')+hand(82,118)+finger(82,123,1,8)\n     +legsDangle+face;\n  } else if(pose==='run'){\n    /* membres groupés → animés en CSS (.fl-run) */\n    g='<g class=\"fl-armb\">'+arm('M78,80 Q92,92 96,106')+hand(97,108)+'<\u002Fg>'\n     +'<g class=\"fl-legb\">'+arm('M68,112 L80,138')+shoe(82,141)+'<\u002Fg>'\n     +body+face\n     +'<g class=\"fl-arma\">'+arm('M42,80 Q28,92 24,106')+hand(23,108)+'<\u002Fg>'\n     +'<g class=\"fl-lega\">'+arm('M52,112 L40,138')+shoe(38,141)+'<\u002Fg>';\n  } else if(pose==='armcross'){\n    g=body\n     +arm('M44,84 Q62,92 80,90')+hand(82,90)\n     +arm('M80,82 Q62,90 44,92')+hand(42,92)\n     +legsStand+eyes()+mouthFlat+cheeks;\n  } else if(pose==='frame'){\n    /* bras levés encadrant le titre */\n    g='<g class=\"fl-arma\">'+arm('M42,80 Q24,58 26,38')+hand(26,36)+'<\u002Fg>'\n     +'<g class=\"fl-armb\">'+arm('M78,80 Q96,58 94,38')+hand(94,36)+'<\u002Fg>'\n     +body+legsStand+eyes()+mouthBig+cheeks;\n  } else if(pose==='prof'){\n    /* bras levé tenant un tableau (anim CSS lève/baisse) */\n    g='<g class=\"fl-armb\">'+arm('M78,78 Q96,64 100,46')+hand(101,44)+'<\u002Fg>'\n     +arm('M42,82 Q30,96 36,106')+hand(36,108)\n     +body+legsStand+face;\n  } else if(pose==='lazy'){\n    /* réveil, étirement (un bras s'étire — anim CSS) */\n    g='<g class=\"fl-arma\">'+arm('M42,78 Q22,62 16,44')+hand(15,42)+'<\u002Fg>'\n     +arm('M78,82 Q90,96 86,108')+hand(86,110)\n     +body+legsStand+eyes()+mouthBig+cheeks;\n  } else if(pose==='vsign'){\n    /* bras en V (façon victoire) */\n    g=arm('M42,80 Q26,56 22,36')+hand(22,34)\n     +arm('M78,80 Q94,56 98,36')+hand(98,34)\n     +body+legsStand+eyes()+mouthBig+cheeks;\n  } else if(pose==='pull'){\n    /* tire un objet : bras tendus vers le bas-gauche, jambes qui glissent */\n    g='<g class=\"fl-arma\">'+arm('M42,82 Q26,96 14,104')+hand(12,106)+'<\u002Fg>'\n     +'<g class=\"fl-armb\">'+arm('M78,84 Q60,98 40,104')+hand(38,105)+'<\u002Fg>'\n     +body+arm('M52,112 Q40,126 30,134')+arm('M68,112 Q60,128 54,138')+shoe(28,137)+shoe(52,141)+eyes()+mouthFlat+cheeks;\n  } else if(pose==='relax'){\n    /* assise confortable, jambes croisées */\n    g=body+arm('M42,86 Q34,98 40,108')+hand(41,109)+arm('M78,86 Q86,98 80,108')+hand(79,109)+legsCross+face;\n  } else if(pose==='lie'){\n    /* couchée sur le ventre, deux mains pointent vers le bas */\n    g='<g transform=\"rotate(180 60 78)\">'+body+'<\u002Fg>'\n     +eyes()+mouthHappy+cheeks\n     +arm('M42,80 Q34,98 40,116')+hand(40,118)+finger(40,123,-1,7)\n     +arm('M78,80 Q86,98 80,116')+hand(80,118)+finger(80,123,1,7);\n  } else if(pose==='mischief'){\n    g=arm('M42,82 Q30,94 36,104')+hand(36,106)+arm('M78,82 Q90,94 84,104')+hand(84,106)\n     +body+legsCross+eyes()+mouthSmirk+cheeks;\n  } else if(pose==='wink'){\n    g=arm('M42,80 Q26,90 20,102')+hand(19,104)+arm('M78,80 Q94,90 100,102')+hand(101,104)+body+legsStand\n     +'<circle cx=\"47\" cy=\"46\" r=\"7.5\" fill=\"#fff\"/>'\n     +'<g class=\"fl-wink\"><circle cx=\"73\" cy=\"46\" r=\"7.5\" fill=\"#fff\"/><circle cx=\"74.5\" cy=\"47.5\" r=\"3.6\" fill=\"'+D+'\"/><\u002Fg>'\n     +'<circle cx=\"48.5\" cy=\"47.5\" r=\"3.6\" fill=\"'+D+'\"/>'\n     +mouthHappy+cheeks;\n  } else { /* fallback = stand */\n    g=arm('M42,80 Q26,90 20,102')+hand(19,104)+arm('M78,80 Q94,90 100,102')+hand(101,104)+body+legsStand+face;\n  }\n  return '<svg viewBox=\"'+vb+'\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;width:100%;overflow:visible\">'+g+'<\u002Fsvg>';\n}\n/* Injection : chaque [data-fleche] reçoit sa pose (+ couleur optionnelle) */\nfunction injectFleche(el){\n  el.innerHTML='<div class=\"fl-inner\">'+fleche(el.getAttribute('data-fleche'),el.getAttribute('data-color'))+'<\u002Fdiv>';\n}\ndocument.querySelectorAll('[data-fleche]').forEach(injectFleche);\nwindow.__fleche=fleche;\n\n/* ============================================================\n   ORCHESTRATION — loader, course (stats), transitions, expertises\n   ============================================================ */\n\n/* ---- Loader : la flèche traverse en courant, puis fade → hero ----\n   Ne se rejoue qu'au PREMIER chargement de session (sessionStorage). */\n(function(){\n  var loader=document.getElementById('loader');\n  if(!loader)return;\n  var seen;try{seen=sessionStorage.getItem('su_loaded');}catch(e){seen=null;}\n  if(reduce||seen){loader.parentNode&&loader.parentNode.removeChild(loader);return;}\n  try{sessionStorage.setItem('su_loaded','1');}catch(e){}\n  document.body.style.overflow='hidden';\n  function end(){\n    loader.classList.add('done');\n    setTimeout(function(){\n      document.body.style.overflow='';\n      loader.parentNode&&loader.parentNode.removeChild(loader);\n      dispatchEvent(new Event('scroll'));\n    },620);\n  }\n  setTimeout(end,1450);\n})();\n\n/* ---- Stats : la flèche court et saute sur chaque métrique ---- */\nfunction runStats(sec){\n  var track=sec.querySelector('.stats-run-track');\n  var runner=sec.querySelector('.stats-runner');\n  var cards=[].slice.call(sec.querySelectorAll('.stat'));\n  var nums=[].slice.call(sec.querySelectorAll('[data-count]'));\n  if(!runner||reduce){nums.forEach(function(n){if(!n.dataset.done){n.dataset.done=1;setCount(n);}});return;}\n  var tr=track.getBoundingClientRect();\n  var stops=cards.map(function(c){var r=c.getBoundingClientRect();return r.left-tr.left+r.width/2;});\n  var trackW=track.offsetWidth;\n  runner.style.opacity='1';runner.style.left='-64px';\n  runner.classList.add('running');\n  function moveTo(px,dur,cb){\n    runner.style.transition='left '+dur+'ms cubic-bezier(.42,0,.58,1)';\n    runner.style.left=px+'px';setTimeout(cb,dur);\n  }\n  var i=0;\n  function step(){\n    if(i>=stops.length){\n      runner.classList.add('running');\n      moveTo(trackW+70,820,function(){runner.style.opacity='0';});\n      return;\n    }\n    moveTo(stops[i]-21,i===0?640:560,function(){\n      runner.classList.remove('running');runner.classList.add('jump');\n      var n=nums[i];if(n&&!n.dataset.done){n.dataset.done=1;countUp(n);}\n      setTimeout(function(){\n        runner.classList.remove('jump');runner.classList.add('running');\n        i++;step();\n      },380);\n    });\n  }\n  setTimeout(step,260);\n}\n/* exempte les compteurs stats du reveal générique (gérés par runStats) */\n(function(){\n  var ss=document.querySelector('.stats-sec');\n  if(!ss)return;\n  ss.querySelectorAll('[data-count]').forEach(function(n){n.dataset.manual=1;});\n})();\n\n/* ---- Observers : stats + transitions de section ---- */\nif('IntersectionObserver' in window && !reduce){\n  var statsSec=document.querySelector('.stats-sec');\n  if(statsSec){\n    var soDone=false;\n    var so=new IntersectionObserver(function(es){\n      es.forEach(function(e){\n        if(e.isIntersecting&&!soDone){soDone=true;runStats(statsSec);so.disconnect();}\n      });\n    },{threshold:.4});\n    so.observe(statsSec);\n  }\n  var trans=[].slice.call(document.querySelectorAll('.sxn-trans'));\n  if(trans.length){\n    var to=new IntersectionObserver(function(es){\n      es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');to.unobserve(e.target);}});\n    },{threshold:.2});\n    trans.forEach(function(t){to.observe(t);});\n  }\n  var wm=document.querySelector('.wordmark-area');\n  if(wm){\n    var wo=new IntersectionObserver(function(es){\n      es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('foot-mascots-on');wo.disconnect();}});\n    },{threshold:.25});\n    wo.observe(wm);\n  }\n} else {\n  var ss2=document.querySelector('.stats-sec');\n  if(ss2)ss2.querySelectorAll('[data-count]').forEach(function(n){if(!n.dataset.done){n.dataset.done=1;setCount(n);}});\n  document.querySelectorAll('.sxn-trans').forEach(function(t){t.classList.add('in');});\n  var wm2=document.querySelector('.wordmark-area');if(wm2)wm2.classList.add('foot-mascots-on');\n}\n\n/* ---- Hero : parallax léger du décor (widgets de fond) ---- */\n(function(){\n  var decor=document.querySelector('.hero-decor');\n  if(!decor||reduce)return;\n  var ticking=false;\n  function upd(){\n    var y=Math.min(scrollY,innerHeight);\n    decor.style.transform='translateY('+(y*-0.06)+'px)';\n    ticking=false;\n  }\n  addEventListener('scroll',function(){if(ticking)return;ticking=true;requestAnimationFrame(upd);},{passive:true});\n})();\n\n/* ---- Expertises : clic = expand + réaction mascotte ---- */\ndocument.querySelectorAll('.exp-card[data-expand]').forEach(function(card){\n  var head=card.querySelector('.exp-head');\n  function toggle(){\n    var open=card.classList.toggle('open');\n    card.setAttribute('aria-expanded',open?'true':'false');\n    var m=card.querySelector('.fleche');\n    if(m){m.classList.remove('react');void m.offsetWidth;m.classList.add('react');}\n  }\n  head.style.cursor='pointer';\n  head.setAttribute('role','button');\n  head.setAttribute('tabindex','0');\n  head.addEventListener('click',toggle);\n  head.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});\n});\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
